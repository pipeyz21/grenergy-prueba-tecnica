services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env

  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8000}"
        VITE_API_KEY: "${VITE_API_KEY:?usa --env-file frontend/.env}"
    ports:
      - "8080:80"
    depends_on:
      - backend
